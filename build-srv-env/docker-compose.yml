services:
  yocto-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-999}
    image: yocto-dev:latest
    container_name: yocto-dev
    hostname: yocto-dev
    stdin_open: true   # docker compose run/exec -it friendly
    tty: true
    volumes:
      # Project sources, build dirs, downloads, sstate-cache: all live on the host.
      - ./yocto-work:/home/${USERNAME:-builder}/yocto
      # Persist shell/bash history and any dotfile tweaks across container recreations.
      - yocto-home:/home/${USERNAME:-builder}
      # Docker-outside-of-Docker: talk to the host's Docker daemon instead of
      # running a nested dockerd. Requires DOCKER_GID above to match the host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TERM=xterm-256color
    # Yocto needs a decent chunk of shared memory for some build tasks.
    shm_size: "120gb"
    # Needed for strace/gdb to attach, and helps perf work inside a container.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    # Uncomment if you hit "too many open files" during builds:
    # ulimits:
    #   nofile:
    #     soft: 100000
    #     hard: 100000

volumes:
  yocto-home:
